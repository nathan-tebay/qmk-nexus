name: Dependency Security Scan

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '0 8 * * 1'  # Weekly, Monday 08:00 UTC

jobs:
  npm-audit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      # Gate on shipped (production) dependencies. Dev-only build tooling
      # (vite/vitest) can carry advisories that don't reach users and often
      # can't be patched without a breaking major bump; audit those separately.
      - run: npm audit --omit=dev --audit-level=high
      - name: Audit dev tooling (non-blocking)
        run: npm audit --audit-level=high || true

  pip-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pip-audit
      - run: pip-audit -r backend/requirements.txt --progress-spinner off
