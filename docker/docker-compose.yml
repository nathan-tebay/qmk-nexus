services:
  frontend:
    container_name: qmknexus
    build:
      context: ../frontend
      dockerfile: ../docker/frontend/Dockerfile.dev
    ports:
      - "3001:3001"
    volumes:
      - ../frontend:/app
      - /app/node_modules
    environment:
      - VITE_API_URL=http://localhost:8000
      - BACKEND_URL=http://backend:8000

  backend:
    container_name: qmknexus-backend
    build:
      context: ../backend
      dockerfile: ../docker/backend/Dockerfile.dev
    user: "1000:1000"
    ports:
      - "8000:8000"
    volumes:
      - ../backend:/app
      # Shared with the host build proxy so generated source files are visible
      # to the proxy and the builder container it spawns.
      # Run the proxy first: ./run.sh build-proxy
      - /tmp/tebay-builds:/tmp/tebay-builds
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file:
      - ../backend/.env
    environment:
      - ENVIRONMENT=development
      # Points to the build proxy started by: ./run.sh build-proxy
      - BUILD_PROXY_URL=http://host.docker.internal:8080
    depends_on: []

  builder:
    build:
      context: ../docker/builder
    image: qmk-nexus-builder
    profiles:
      - build
